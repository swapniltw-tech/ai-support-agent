[project]
name = "policypal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "swapy", email = "spmswapnil@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.6.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2"
]

[project.scripts]
policypal = "policypal:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "scripts", "tests"]
plugins = ["pydantic.mypy"]
